name: calorie_tracker
description: A production-grade Flutter calorie tracker.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  fl_chart: ^0.69.0 

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.1.3

  # Local Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.5

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking
  http: ^1.2.2
  connectivity_plus: ^6.1.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Ads
  google_mobile_ads: ^5.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.4.2
  logger: ^2.4.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.1

  # Splash Screen Generator
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/google_logo.png